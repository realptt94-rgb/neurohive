services:
  - type: web
    name: neurohive-backend
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true
